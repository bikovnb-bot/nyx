name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  SINGBOX_VERSION: "1.14.2"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        shell: bash
        run: npm test

      # Informational only — never fails the build. Just a nudge so a pinned
      # SINGBOX_VERSION doesn't quietly go stale for months; bumping it is
      # still a manual, tested decision (see README "Выпуск релиза").
      - name: Warn if a newer sing-box release exists
        shell: bash
        run: |
          latest=$(curl -fsSL https://api.github.com/repos/SagerNet/sing-box/releases/latest | grep -oP '"tag_name":\s*"v\K[^"]+')
          if [ -z "$latest" ]; then
            echo "::warning::Could not fetch the latest sing-box release from GitHub to compare against SINGBOX_VERSION=$SINGBOX_VERSION."
          elif [ "$latest" != "$SINGBOX_VERSION" ]; then
            echo "::warning::Pinned SINGBOX_VERSION is $SINGBOX_VERSION but sing-box $latest is now available: https://github.com/SagerNet/sing-box/releases/tag/v$latest — consider updating after checking its changelog for breaking config changes."
          else
            echo "SINGBOX_VERSION=$SINGBOX_VERSION is up to date with the latest sing-box release."
          fi

      - name: Download sing-box
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $url = "https://github.com/SagerNet/sing-box/releases/download/v$env:SINGBOX_VERSION/sing-box-$env:SINGBOX_VERSION-windows-amd64.zip"
          Invoke-WebRequest -Uri $url -OutFile sing-box.zip
          Expand-Archive -Path sing-box.zip -DestinationPath sing-box-extracted
          New-Item -ItemType Directory -Force -Path vendor | Out-Null
          Copy-Item "sing-box-extracted\sing-box-$env:SINGBOX_VERSION-windows-amd64\sing-box.exe" "vendor\sing-box.exe"

      - name: Regenerate icons
        run: npm run icons

      - name: Build the Windows installer
        run: npm run dist

      # electron-builder's own --publish flow races itself when uploading
      # multiple assets in parallel: each upload independently checks "does
      # the release exist yet?", finds no, and tries to create it — the
      # loser of that race fails silently and the step still reports
      # success with assets missing. Build only, then upload with a
      # dedicated, single-writer action instead.
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.exe
            release/*.exe.blockmap
            release/latest.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
