name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  SINGBOX_VERSION: "1.13.20"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Download sing-box
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $url = "https://github.com/SagerNet/sing-box/releases/download/v$env:SINGBOX_VERSION/sing-box-$env:SINGBOX_VERSION-windows-amd64.zip"
          Invoke-WebRequest -Uri $url -OutFile sing-box.zip
          Expand-Archive -Path sing-box.zip -DestinationPath sing-box-extracted
          New-Item -ItemType Directory -Force -Path vendor | Out-Null
          Copy-Item "sing-box-extracted\sing-box-$env:SINGBOX_VERSION-windows-amd64\sing-box.exe" "vendor\sing-box.exe"

      - name: Regenerate icons
        run: npm run icons

      - name: Build and publish the Windows installer
        run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
