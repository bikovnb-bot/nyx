<!doctype html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<title>Nyx</title>
<link rel="stylesheet" href="app.css" />
<script>
  (function () {
    try {
      var m = localStorage.getItem("nyxTheme") || "dark";
      var light = m === "light" || (m === "system" && window.matchMedia("(prefers-color-scheme: light)").matches);
      document.documentElement.setAttribute("data-theme", light ? "light" : "dark");
    } catch (e) {}
  })();
</script>
</head>
<body data-state="stopped">
<div id="app">
  <header>
    <div class="brand"><img src="logo.png" alt="" /><span>Nyx</span></div>
    <button class="icon-btn" id="openSettings" aria-label="Настройки">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3h0a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5h0a1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8v0a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </button>
  </header>

  <main>
    <section class="hero">
      <button class="power" id="power" aria-label="Подключить">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 2v10"/><path d="M18.4 6.6a9 9 0 1 1-12.8 0"/></svg>
      </button>
      <div id="status">Отключено</div>
      <div id="sub"></div>
      <div class="issue" id="issue" hidden><b id="issueTitle"></b><span id="issueHint"></span></div>
    </section>

    <section class="list-head">
      <h2>Серверы</h2>
      <span id="count"></span>
    </section>
    <section id="list"></section>
    <div id="empty" hidden>
      <p>Серверов пока нет.</p>
      <p class="dim">Нажмите «+», чтобы добавить ссылку, QR-код или подписку.</p>
    </div>
  </main>

  <button class="fab" id="addBtn" aria-label="Добавить сервер">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
  </button>
</div>

<!-- sheets and screens -->
<div class="backdrop" id="backdrop"></div>

<div class="sheet" id="addSheet">
  <div class="grab"></div>
  <h3>Добавить сервер</h3>
  <textarea id="addText" placeholder="Вставьте ссылку vless:// (можно несколько) или адрес подписки https://…" spellcheck="false" autocapitalize="off" autocomplete="off"></textarea>
  <div class="row">
    <button class="btn" id="pasteBtn">Вставить из буфера</button>
    <button class="btn" id="scanBtn">Сканировать QR</button>
  </div>
  <button class="btn primary wide" id="addConfirm">Добавить</button>
</div>

<div class="sheet" id="itemSheet">
  <div class="grab"></div>
  <h3 id="itemTitle"></h3>
  <button class="btn wide" id="itemConnect">Подключиться</button>
  <button class="btn wide" id="itemFav">В избранное</button>
  <button class="btn wide" id="itemCopy">Копировать ссылку</button>
  <button class="btn wide danger" id="itemDelete">Удалить</button>
</div>

<div class="screen" id="settings">
  <header>
    <button class="icon-btn" id="closeSettings" aria-label="Назад"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
    <span class="title">Настройки</span>
    <span></span>
  </header>
  <div class="scroll">
    <div class="group">
      <div class="gh">Оформление</div>
      <div class="seg" id="themeSeg">
        <button data-theme-mode="dark">Тёмная</button>
        <button data-theme-mode="light">Светлая</button>
        <button data-theme-mode="system">Как в системе</button>
      </div>
    </div>

    <div class="group">
      <div class="gh">Маршрутизация и DNS</div>
      <label class="sw"><span><b>Сайты РФ напрямую</b><small>Банки, госуслуги, маркетплейсы и все .ru идут мимо VPN</small></span><input type="checkbox" id="directRu" /><i></i></label>
      <label class="sw"><span><b>Блокировка рекламы и трекеров</b><small>Блокируются рекламные домены</small></span><input type="checkbox" id="blockAds" /><i></i></label>
      <div class="field"><span>DNS-сервер (через туннель)</span>
        <div class="seg" id="dnsSeg">
          <button data-dns="cloudflare">Cloudflare</button>
          <button data-dns="google">Google</button>
          <button data-dns="quad9">Quad9</button>
        </div>
      </div>
      <label class="sw"><span><b>Обход блокировок (TLS fragment)</b><small>Делит TLS-рукопожатие на части против DPI</small></span><input type="checkbox" id="fragment" /><i></i></label>
    </div>

    <div class="group">
      <div class="gh">Приложения</div>
      <div class="field"><span>Какие приложения идут через VPN</span>
        <div class="seg" id="appModeSeg">
          <button data-appmode="all">Все</button>
          <button data-appmode="exclude">Все, кроме</button>
          <button data-appmode="include">Только выбранные</button>
        </div>
      </div>
      <button class="btn wide" id="pickApps" hidden>Выбрать приложения (<span id="appCount">0</span>)</button>
    </div>

    <div class="group">
      <div class="gh">Подписки</div>
      <div id="subList"></div>
      <button class="btn wide" id="syncSubs">Обновить все подписки</button>
    </div>

    <div class="group">
      <div class="gh">О программе</div>
      <p class="dim" id="aboutText"></p>
    </div>
  </div>
</div>

<div class="screen" id="appsScreen">
  <header>
    <button class="icon-btn" id="closeApps" aria-label="Назад"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
    <span class="title" id="appsTitle">Приложения</span>
    <span></span>
  </header>
  <input id="appSearch" class="search" placeholder="Поиск приложения" />
  <div class="scroll" id="appList"></div>
</div>

<div class="screen" id="scanner">
  <video id="scanVideo" playsinline muted></video>
  <div class="scan-frame"></div>
  <button class="btn" id="scanClose">Закрыть</button>
</div>

<div id="toasts"></div>

<script src="jsQR.js"></script>
<script src="nyx-core.js"></script>
<script src="app.js"></script>
</body>
</html>
